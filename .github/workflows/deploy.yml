# Deploie le bot sur le serveur a chaque push sur master. Tourne sur le runner
# auto-heberge "purple-prod". Jamais declenche par une pull request : du code
# exterieur ne peut pas atteindre le serveur (le depot est public, et les
# workflows des contributeurs externes demandent en plus une approbation).
name: Deploy
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Syntax check
        run: git ls-files '*.js' | xargs -n1 node --check
  deploy:
    needs: check
    runs-on: [self-hosted, purple-prod]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run the Nomad job
        run: bash ./deploy.sh
